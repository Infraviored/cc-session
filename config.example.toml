# cc-session configuration. Copy to ~/.config/cc-session/config.toml
# (or $XDG_CONFIG_HOME/cc-session/config.toml). Every key is optional.

# Command that starts Claude Code. It runs through your interactive shell,
# so aliases apply; use "command claude" to bypass a `claude` alias.
command = "claude"

# Launch mode used by Enter / Alt-C until you pick another one with Alt-M
# (the pick is remembered in ~/.config/cc-session/state).
# mode = "default"

# Claude Code config directories to list sessions from. Without any entry,
# cc-session uses $CLAUDE_HOME, $CLAUDE_CONFIG_DIR or ~/.claude.
# Sessions from a directory other than ~/.claude are resumed with
# CLAUDE_CONFIG_DIR set to it.
#
# [[profiles]]
# name = "private"
# config_dir = "~/.claude"
#
# [[profiles]]
# name = "work"
# config_dir = "~/.claude-work"

# Launch modes: extra arguments passed to claude when resuming. Without any
# entry, these two are used.
[[modes]]
name = "default"
args = []

[[modes]]
name = "skip permissions"
args = ["--dangerously-skip-permissions"]

# A mode can run its own command instead of `command`, e.g. the sandbox
# launcher xclaude (claude-in-a-box), which mounts the session's directory
# into a fresh container. A mode's `command` is inserted into the shell line
# unquoted (quote paths with spaces yourself). `pass_profile = false`
# leaves out CLAUDE_CONFIG_DIR (the launcher picks the Claude account itself);
# it also works on a plain-claude mode and then drops CLAUDE_CONFIG_DIR.
#
# [[modes]]
# name = "xclaude"
# command = "xclaude ."   # `.` = the session's dir; add more with `e` in Alt-Enter
# pass_profile = false
